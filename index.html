<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Snap Solve</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, system-ui, sans-serif;
    background: #111; color: #eee; display: flex; flex-direction: column;
  }
  .wrap { padding: 20px; max-width: 640px; margin: 0 auto; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  label { display: block; margin: 14px 0 6px; font-size: 14px; color: #aaa; }
  input, select {
    width: 100%; padding: 12px; font-size: 16px; border-radius: 10px;
    border: 1px solid #333; background: #1c1c1c; color: #eee;
  }
  button {
    font-size: 17px; padding: 14px 18px; border-radius: 12px; border: 0;
    background: #3a7afe; color: #fff; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: #2a2a2a; }
  .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .hidden { display: none !important; }
  .small { font-size: 13px; color: #888; margin-top: 8px; }
  #status { font-size: 14px; color: #aaa; margin: 10px 0; min-height: 20px; }

  /* Phone */
  #phone { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 20px; }
  #answer {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    font-size: 19px; line-height: 1.4; padding: 16px; border-radius: 16px; background: #1a1a1a;
    word-break: break-word; min-height: 160px;
  }
  .line { padding: 6px 0; border-bottom: 1px solid #262626; }
  .line:last-child { border-bottom: 0; }
  .line.final { font-size: 26px; font-weight: 700; color: #7fd18b; padding-top: 12px; }
  .line.msg { text-align: center; font-size: 24px; font-weight: 600; padding-top: 40px; border: 0; }
  #snapBtn {
    width: 100%; height: 22vh; font-size: 34px; border-radius: 24px; flex-shrink: 0;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s;
  }
  #snapBtn .hint { font-size: 13px; font-weight: 500; opacity: .75; }
  #snapBtn.holding { background: #f0a020; }
  #pagesBar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #2a2210; color: #f0c060; padding: 8px 8px 8px 14px; border-radius: 12px; font-weight: 600;
  }
  #pagesBar.hidden { display: none; }
  #pagesBar button { padding: 8px 14px; font-size: 15px; }
  #snapBtn:disabled { background: #444; }

  /* iPad */
  #ipad { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  video { width: 100%; max-height: 70vh; background: #000; border-radius: 12px; object-fit: contain; }
  #lastShot { max-width: 220px; border-radius: 8px; }
  #ipadAnswer { font-size: 18px; line-height: 1.4; }
  .gear { position: fixed; top: 10px; right: 10px; background: #222; padding: 8px 12px; font-size: 14px; z-index: 5; }
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup" class="wrap hidden">
  <h1>Snap Solve setup</h1>

  <label>This device is the…</label>
  <select id="role">
    <option value="phone">Phone (button + answer)</option>
    <option value="ipad">iPad (camera + Claude)</option>
  </select>

  <label>Pairing code (must match on both devices)</label>
  <div class="row" style="margin-top:0">
    <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:3">
    <button class="secondary" id="genCode" style="flex:1">New</button>
  </div>
  <div class="small">Long random code = private channel. Anyone with this code can see your answers.</div>

  <div id="ipadFields">
    <label>Anthropic API key (stored only on this iPad)</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-...">
    <label>Model</label>
    <select id="model">
      <option value="claude-sonnet-5-5">Sonnet 5.5 (fast, cheap)</option>
      <option value="claude-opus-5-5">Opus 5.5 (smartest, slower)</option>
      <option value="claude-haiku-5-5">Haiku 5.5 (fastest)</option>
    </select>
  </div>

  <div class="row"><button id="saveBtn">Save &amp; start</button></div>
</div>

<!-- PHONE -->
<div id="phone" class="hidden">
  <button class="gear secondary" data-settings>⚙︎</button>
  <div id="answer"><div class="line msg">Ready</div></div>
  <div id="pagesBar" class="hidden">
    <span id="pagesCount"></span>
    <button class="secondary" id="clearBtn">Clear</button>
  </div>
  <div id="phoneStatus" class="small" style="text-align:center"></div>
  <button id="snapBtn">SNAP<span class="hint">tap = solve · hold = add page</span></button>
</div>

<!-- IPAD -->
<div id="ipad" class="hidden">
  <button class="gear secondary" data-settings>⚙︎</button>
  <div class="row" style="margin-top:0" id="camStartRow">
    <button id="camStart">Start camera</button>
  </div>
  <video id="video" playsinline muted autoplay></video>
  <div id="status"></div>
  <div class="row" style="margin-top:0">
    <button class="secondary" id="testAdd">Add page here</button>
    <button class="secondary" id="testSnap">Snap + solve here</button>
  </div>
  <div id="heldThumbs" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <img id="lastShot" class="hidden" alt="">
  <div id="ipadAnswer"></div>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => localStorage.getItem('snapsolve_' + k) || '',
  set: (k, v) => localStorage.setItem('snapsolve_' + k, v),
};
const RELAY = 'https://ntfy.sh/';

// Render a multi-line solution: one step per line, final "ANSWER:" line highlighted.
function renderSolution(el, text, isMsg) {
  el.replaceChildren();
  const lines = isMsg ? [text] : text.split('\n').map(s => s.trim()).filter(Boolean);
  for (const l of lines) {
    const d = document.createElement('div');
    d.className = 'line' + (isMsg ? ' msg' : /^ANSWER:/i.test(l) ? ' final' : '');
    d.textContent = l;
    el.appendChild(d);
  }
  el.scrollTop = 0;
}

// ntfy.sh turns messages over 4096 bytes into attachments, so keep under that.
function fitBytes(s, max) {
  const enc = new TextEncoder();
  if (enc.encode(s).length <= max) return s;
  while (enc.encode(s + '…').length > max) s = s.slice(0, -1);
  return s + '…';
}

function randomCode() {
  const a = new Uint8Array(18);
  crypto.getRandomValues(a);
  return 'ss-' + Array.from(a, b => b.toString(36).padStart(2, '0')).join('').slice(0, 28);
}

// ---------- relay (ntfy.sh) ----------
function topic() { return store.get('code'); }

async function send(msg) {
  await fetch(RELAY + encodeURIComponent(topic()), { method: 'POST', body: msg });
}

function listen(onMsg, onState) {
  let es;
  const connect = () => {
    es = new EventSource(RELAY + encodeURIComponent(topic()) + '/sse');
    es.onopen = () => onState && onState(true);
    es.onerror = () => onState && onState(false); // EventSource auto-reconnects
    es.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        if (d.event === 'message' && typeof d.message === 'string') onMsg(d.message);
      } catch {}
    };
  };
  connect();
  // Safari may kill the stream when backgrounded; reconnect on return.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && es.readyState === EventSource.CLOSED) connect();
  });
}

// ---------- setup ----------
function showSetup() {
  for (const id of ['phone', 'ipad']) $(id).classList.add('hidden');
  $('setup').classList.remove('hidden');
  $('role').value = store.get('role') || 'phone';
  $('code').value = store.get('code') || randomCode();
  $('apiKey').value = store.get('apiKey');
  $('model').value = store.get('model') || 'claude-sonnet-5-5';
  toggleIpadFields();
}
function toggleIpadFields() {
  $('ipadFields').classList.toggle('hidden', $('role').value !== 'ipad');
}
$('role').onchange = toggleIpadFields;
$('genCode').onclick = () => { $('code').value = randomCode(); };
$('saveBtn').onclick = () => {
  const code = $('code').value.trim();
  if (code.length < 12) return alert('Pairing code too short (use 12+ characters).');
  if ($('role').value === 'ipad' && !$('apiKey').value.trim().startsWith('sk-ant-'))
    return alert('Enter a valid Anthropic API key.');
  store.set('role', $('role').value);
  store.set('code', code);
  if ($('role').value === 'ipad') {
    store.set('apiKey', $('apiKey').value.trim());
    store.set('model', $('model').value);
  }
  location.reload();
};
document.querySelectorAll('[data-settings]').forEach(b => b.onclick = showSetup);

// ---------- phone ----------
function startPhone() {
  $('phone').classList.remove('hidden');
  const btn = $('snapBtn');
  let pending = null, timer = null;   // in-flight solve request
  const newId = () => Math.random().toString(36).slice(2, 8);

  const setAnswer = (t) => renderSolution($('answer'), t, true);
  const setSolution = (t) => renderSolution($('answer'), t, false);
  const done = () => { pending = null; clearTimeout(timer); btn.disabled = false; };
  const setCount = (n) => {
    $('pagesBar').classList.toggle('hidden', n === 0);
    $('pagesCount').textContent = n + (n === 1 ? ' page held' : ' pages held') + ' · tap to solve';
  };

  listen((m) => {
    const [kind, id, ...rest] = m.split(':');
    const body = rest.join(':');
    if (kind === 'count') setCount(Number(body) || 0);           // iPad's held-page count changed
    else if (kind === 'added') { setCount(Number(body) || 0); setAnswer('Page ' + body + ' added'); }
    if (!pending || id !== pending) return;
    if (kind === 'ack') setAnswer('Solving ' + body + (body === '1' ? ' page…' : ' pages…'));
    else if (kind === 'ans') { setSolution(body); done(); }
    else if (kind === 'err') { setAnswer('Error: ' + body); done(); }
  }, (ok) => { $('phoneStatus').textContent = ok ? 'Connected' : 'Reconnecting…'; });

  async function solve() {
    pending = newId();
    btn.disabled = true;
    setAnswer('Sending…');
    try { await send('snap:' + pending); }
    catch { setAnswer('Network error'); return done(); }
    timer = setTimeout(() => { setAnswer('No reply from iPad. Is the page open + camera on?'); done(); }, 120000);
  }
  async function addPage() {
    setAnswer('Adding page…');
    try { await send('add:' + newId()); } catch { setAnswer('Network error'); }
  }
  $('clearBtn').onclick = async () => {
    try { await send('clear:' + newId()); setAnswer('Pages cleared'); } catch { setAnswer('Network error'); }
  };

  // One button: tap = snap this page + solve everything; hold = snap this page and keep it.
  let holdTimer = null, held = false, down = false;
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
  btn.addEventListener('pointerdown', (e) => {
    if (btn.disabled) return;
    down = true; held = false;
    try { btn.setPointerCapture(e.pointerId); } catch {}
    holdTimer = setTimeout(() => {
      held = true;
      btn.classList.add('holding');
      if (navigator.vibrate) navigator.vibrate(40);
      addPage();
    }, 400);
  });
  btn.addEventListener('pointerup', () => {
    if (!down) return;
    down = false;
    clearTimeout(holdTimer);
    btn.classList.remove('holding');
    if (!held && !btn.disabled) solve();
  });
  btn.addEventListener('pointercancel', () => {
    down = false; clearTimeout(holdTimer); btn.classList.remove('holding');
  });
}

// ---------- iPad ----------
const SYSTEM = `You are looking at one or more photos of a question (homework, worksheet, screen, etc).
If there are several photos, they are consecutive pages of the same question, in order: combine them.
Read the question carefully and solve it.
Reply ONLY in this format, nothing before or after:
1. <first step>
2. <second step>
...
ANSWER: <the final answer>
Rules:
- One step or decision per line. Keep each line short (under ~15 words).
- List every step needed, in order. Simple questions may need only one step.
- Plain text only: no markdown, no bold, no LaTeX. Write math like x^2, sqrt(3), 3/4.
- If multiple questions are visible, solve the most prominent one.
- If there is no readable question, reply only: ANSWER: No question found.`;

async function askClaude(images) {
  const content = [];
  images.forEach((data, i) => {
    if (images.length > 1) content.push({ type: 'text', text: `Page ${i + 1} of ${images.length}:` });
    content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data } });
  });
  content.push({ type: 'text', text: images.length > 1 ? 'Solve the question across these pages.' : 'Solve the question in this photo.' });

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': store.get('apiKey'),
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: store.get('model') || 'claude-sonnet-5-5',
      max_tokens: 16000,
      system: SYSTEM,
      messages: [{ role: 'user', content }],
    }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data?.error?.message || ('HTTP ' + res.status));
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  if (!text) return 'ANSWER: (empty reply)';
  // Drop any preamble before the first numbered step / ANSWER line.
  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
  const start = lines.findIndex(l => /^(\d+[.)]|ANSWER:)/i.test(l));
  const out = (start > 0 ? lines.slice(start) : lines).join('\n');
  return fitBytes(out, 3800);
}

function startIpad() {
  $('ipad').classList.remove('hidden');
  const video = $('video');
  let busy = false;
  const status = (t) => { $('status').textContent = t; };

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1440 } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      $('camStartRow').classList.add('hidden');
      status('Camera on. Waiting for phone…');
      try { await navigator.wakeLock?.request('screen'); } catch {}
    } catch (e) {
      status('Camera error: ' + e.message);
    }
  }
  $('camStart').onclick = startCamera;
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') { try { await navigator.wakeLock?.request('screen'); } catch {} }
  });

  function capture() {
    if (!video.videoWidth) throw new Error('Camera not started');
    const max = 1568; // Claude's sweet spot for image size
    const scale = Math.min(1, max / Math.max(video.videoWidth, video.videoHeight));
    const c = $('canvas');
    c.width = Math.round(video.videoWidth * scale);
    c.height = Math.round(video.videoHeight * scale);
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.85);
    $('lastShot').src = url; $('lastShot').classList.remove('hidden');
    return url.split(',')[1];
  }

  const MAX_PAGES = 10;
  let pages = [];  // held pages (base64 JPEG), sent together on the next solve

  function showHeld() {
    const box = $('heldThumbs');
    box.replaceChildren();
    pages.forEach((p) => {
      const img = document.createElement('img');
      img.src = 'data:image/jpeg;base64,' + p;
      img.style.cssText = 'height:70px;border-radius:6px;border:2px solid #f0a020';
      box.appendChild(img);
    });
  }

  // Hold on phone: capture one page and keep it.
  async function handleAdd(id, reply) {
    if (busy) return reply && send('err:' + id + ':Busy solving, wait');
    try {
      if (pages.length >= MAX_PAGES) throw new Error('Max ' + MAX_PAGES + ' pages');
      pages.push(capture());
      showHeld();
      status(pages.length + ' page(s) held. Hold again for more, tap to solve.');
      reply && await send('added:' + id + ':' + pages.length);
    } catch (e) {
      status('Error: ' + e.message);
      reply && send('err:' + id + ':' + e.message);
    }
  }

  // Tap on phone: capture this page, then solve all held pages + this one.
  async function handleSolve(id, reply) {
    if (busy) return reply && send('err:' + id + ':Busy, try again');
    busy = true;
    const held = pages;
    try {
      const imgs = [...held, capture()];
      pages = []; showHeld();
      reply && send('ack:' + id + ':' + imgs.length);
      status('Asking Claude about ' + imgs.length + ' page(s)…');
      const ans = await askClaude(imgs);
      renderSolution($('ipadAnswer'), ans, false);
      status('Done. Waiting for phone…');
      reply && await send('ans:' + id + ':' + ans);
    } catch (e) {
      pages = held; showHeld();  // keep earlier pages so a retry doesn't lose them
      status('Error: ' + e.message);
      reply && send('err:' + id + ':' + e.message);
    } finally {
      busy = false;
      reply && send('count:' + id + ':' + pages.length);
    }
  }

  async function handleClear(id, reply) {
    if (busy) return;
    pages = []; showHeld();
    status('Pages cleared. Waiting for phone…');
    reply && send('count:' + id + ':0');
  }

  $('testAdd').onclick = () => handleAdd('local', false);
  $('testSnap').onclick = () => handleSolve('local', false);
  listen((m) => {
    const [kind, id] = m.split(':');
    if (kind === 'snap') handleSolve(id, true);
    else if (kind === 'add') handleAdd(id, true);
    else if (kind === 'clear') handleClear(id, true);
  }, (ok) => { if (!ok) status('Relay reconnecting…'); });

  startCamera();
}

// ---------- boot ----------
const role = store.get('role');
if (!role || !store.get('code') || (role === 'ipad' && !store.get('apiKey'))) showSetup();
else if (role === 'ipad') startIpad();
else startPhone();
</script>
</body>
</html>
